<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم لمحة</title>
<style>
  body{margin:0;background:#0C0E1B;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px}
  main{max-width:820px;margin:auto;display:grid;gap:14px}
  section{background:#171A30;border-radius:14px;padding:16px}
  h1,h2{margin:0 0 10px} h2{font-size:16px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{font:inherit;padding:10px 14px;border-radius:10px;border:0;background:#FE2C55;color:#fff;font-weight:700;cursor:pointer}
  button.alt{background:#2b3060}
  button:disabled{opacity:.5}
  pre{background:#0C0E1B;padding:10px;border-radius:10px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-word}
  .k{color:#9aa0c8}
</style>
</head>
<body>
<main>
  <div class="row"><h1 style="flex:1">🛠️ لوحة التحكم</h1><button class="alt" id="logout">خروج</button></div>
  <section><h2>الحالة</h2><pre id="status">جارٍ التحميل…</pre></section>
  <section>
    <h2>تحديث العروض</h2>
    <p class="k">يجلب العروض من الـ feeds المضبوطة، يصنّفها (محلياً + AI لو مفعّل)، ويحفظ deals.json.</p>
    <div class="row">
      <button id="upd">تحديث الآن</button>
      <button class="alt" id="updPub">تحديث + نشر</button>
      <button class="alt" id="updRe">إعادة تصنيف الكل</button>
    </div>
    <pre id="result" hidden></pre>
  </section>
  <section><h2>آخر عمليات الأدمن (Audit)</h2><pre id="audit">…</pre></section>
</main>
<script>
const H = { 'Content-Type': 'application/json', 'X-Lamha-Admin': '1' };
const $ = id => document.getElementById(id);
async function api(path, opts) {
  const r = await fetch(path, { ...opts, headers: H });
  if (r.status === 401) { location.href = '/admin/login'; throw new Error('unauthorized'); }
  return r.json();
}
async function refresh() {
  $('status').textContent = JSON.stringify(await api('/admin/api/status'), null, 2);
  const a = await api('/admin/api/audit');
  $('audit').textContent = (a.entries || []).map(e => `${e.ts || e.at || ''}  ${e.action}  ${e.result}`).join('\n') || 'لا يوجد';
}
async function run(body, btn) {
  btn.disabled = true; $('result').hidden = false; $('result').textContent = 'جارٍ التنفيذ…';
  try { $('result').textContent = JSON.stringify(await api('/admin/api/update-deals', { method: 'POST', body: JSON.stringify(body) }), null, 2); }
  finally { btn.disabled = false; refresh(); }
}
$('upd').onclick = e => run({}, e.target);
$('updPub').onclick = e => run({ publish: true }, e.target);
$('updRe').onclick = e => run({ reclassify: true }, e.target);
$('logout').onclick = async () => { await api('/admin/logout', { method: 'POST' }); location.href = '/admin/login'; };
refresh();
</script>
</body>
</html>
